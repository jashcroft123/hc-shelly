name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.95.0 check --no-default-features --locked
